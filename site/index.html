<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GfbV Link in Bio</title>
<meta name="description" content="Gesellschaft für bedrohte Völker – weiterführende Links zu unseren aktuellen Instagram-Beiträgen.">
<link rel="preload" href="schrift/Aller_Std_Rg.ttf" as="font" type="font/ttf" crossorigin>
<link rel="preload" href="schrift/Aller_Std_Bd.ttf" as="font" type="font/ttf" crossorigin>
<style>
  /* Hausschrift Aller (Dalton Maag, Standard Edition, unveränderte TTF-Dateien – Lizenz in schrift/) */
  @font-face { font-family: "Aller"; src: url("schrift/Aller_Std_Rg.ttf") format("truetype"); font-weight: 400; font-style: normal; font-display: swap; }
  @font-face { font-family: "Aller"; src: url("schrift/Aller_Std_Bd.ttf") format("truetype"); font-weight: 700; font-style: normal; font-display: swap; }
  /* Layout: eine ruhige Spalte – Logo und Einleitung oben links, darunter das Beitragsraster (2 → 3 → 4 Spalten).
     Farben ausschließlich aus dem Stylesheet von gfbv.de (--b-blue, --b-blue-middle, --b-blue-light, --b-yellow-dark, --b-red). */
  :root {
    --weiss: #FFFFFF;
    --schwarz: #000000;
    --blau: #007BB1;          /* gfbv.de --b-blue / primary */
    --blau-mittel: #3E94C4;   /* gfbv.de --b-blue-middle */
    --blau-hell: #CEE4EE;     /* gfbv.de --b-blue-light */
    --gelb: #F6DB3A;          /* gfbv.de --b-yellow-dark */
    --rot: #C81450;           /* gfbv.de --b-red / secondary – nur für Hinweise */
    --text: #000000;
    --text-leise: rgba(0, 0, 0, .58);
    --schrift: "Aller", "Open Sans", "Segoe UI", Helvetica, Arial, sans-serif;
    --radius: 18px;
    --spalte: 1120px;
    --ease: cubic-bezier(.22, .61, .36, 1);
    color-scheme: light;
  }

  html { background: var(--weiss); }
  body {
    background: var(--weiss);
    color: var(--text);
    font-family: var(--schrift);
    font-size: 17px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    padding-inline: clamp(18px, 5vw, 56px);
    padding-block: 0;
    overflow-x: hidden;
  }

  .skip {
    position: absolute; left: 12px; top: -60px;
    background: var(--blau); color: var(--weiss);
    padding: 10px 16px; border-radius: 10px; text-decoration: none; font-weight: 700;
    z-index: 10;
  }
  .skip:focus { top: 12px; }

  /* ── Farbfeld: langsam fließende, weiche Formen hinter dem Kopf ── */
  .flow {
    position: absolute; inset: 0 0 auto 0; height: min(560px, 90vw);
    pointer-events: none; overflow: hidden; z-index: 0;
  }
  .flow span {
    position: absolute; border-radius: 50%;
    filter: blur(56px); opacity: .7;
    will-change: transform;
  }
  .flow .a { width: max(46vw, 300px); max-width: 520px; aspect-ratio: 1; right: -8vw; top: -18vw;
             background: radial-gradient(circle at 40% 40%, var(--blau-hell), transparent 68%);
             animation: drift-a 38s var(--ease) infinite alternate; }
  .flow .b { width: 30vw; max-width: 340px; aspect-ratio: 1; right: 14vw; top: 2vw;
             background: radial-gradient(circle at 50% 50%, color-mix(in srgb, var(--blau-mittel) 45%, transparent), transparent 70%);
             opacity: .4;
             animation: drift-b 46s var(--ease) infinite alternate; }
  .flow .c { width: max(16vw, 110px); max-width: 190px; aspect-ratio: 1; right: 4vw; top: 16vw;
             background: radial-gradient(circle, color-mix(in srgb, var(--gelb) 55%, transparent), transparent 70%);
             opacity: .45;
             animation: drift-c 52s var(--ease) infinite alternate; }
  @keyframes drift-a { to { transform: translate(-6vw, 5vw) scale(1.08); } }
  @keyframes drift-b { to { transform: translate(5vw, 4vw) scale(.92); } }
  @keyframes drift-c { to { transform: translate(-9vw, -3vw) scale(1.15); } }

  .seite { position: relative; z-index: 1; max-width: var(--spalte); margin-inline: auto; }

  /* ── Kopf ── */
  header {
    display: grid; gap: clamp(28px, 5vw, 44px);
    padding-block: clamp(44px, 9vw, 96px) clamp(40px, 7vw, 72px);
  }
  .logo { display: inline-block; width: clamp(200px, 46vw, 280px); line-height: 0; border-radius: 6px; }
  .logo img { width: 100%; height: auto; }
  .intro { display: grid; gap: 10px; max-width: 34ch; }
  h1 {
    margin: 0; font-size: clamp(1.75rem, 1.3rem + 2vw, 2.6rem);
    font-weight: 700; line-height: 1.1; letter-spacing: -.005em; text-wrap: balance;
  }
  h1 .akzent { color: var(--blau); }
  .unterzeile { margin: 0; color: var(--text-leise); font-size: 1rem; }

  /* ── Raster ── */
  .raster {
    list-style: none; margin: 0; padding: 0;
    display: grid; gap: clamp(28px, 4vw, 44px) clamp(14px, 3vw, 32px);
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
  @media (min-width: 720px)  { .raster { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
  @media (min-width: 1080px) { .raster { grid-template-columns: repeat(4, minmax(0, 1fr)); } }

  .kachel { min-width: 0; animation: auftauchen .9s var(--ease) both; animation-delay: calc(var(--i, 0) * 70ms + 120ms); }
  @keyframes auftauchen { from { opacity: 0; transform: translateY(14px); } }

  .kachel a {
    display: grid; gap: 12px; color: inherit; text-decoration: none;
    border-radius: calc(var(--radius) + 4px);
    outline: none;
    -webkit-tap-highlight-color: transparent;
  }
  .bild {
    position: relative; border-radius: var(--radius); overflow: hidden;
    aspect-ratio: 4 / 5; max-width: 100%;
    background: linear-gradient(160deg, var(--blau-hell), #fff);
    box-shadow: 0 1px 2px rgba(0, 62, 89, .06), 0 8px 24px -12px rgba(0, 62, 89, .18);
    transition: transform .6s var(--ease), box-shadow .6s var(--ease);
    isolation: isolate;
  }
  .bild img {
    display: block; width: 100%; height: 100%;
    object-fit: contain; /* Gestaltung bleibt vollständig sichtbar */
    transition: transform .9s var(--ease);
  }
  /* sanfter Lichtschimmer beim Darüberfahren */
  .bild::after {
    content: ""; position: absolute; inset: 0; z-index: 1; pointer-events: none;
    background: linear-gradient(115deg, transparent 35%, rgba(255,255,255,.11) 50%, transparent 65%);
    transform: translateX(-110%);
    transition: transform 1.2s var(--ease);
  }

  .meta { display: grid; gap: 4px; padding-inline: 2px; min-width: 0; }
  .zeile {
    display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px;
    font-size: .76rem; letter-spacing: .07em; text-transform: uppercase; color: var(--text-leise);
    font-variant-numeric: tabular-nums;
  }
  .art { color: var(--blau); font-weight: 700; }
  .titel {
    margin: 0; font-size: clamp(.95rem, .9rem + .25vw, 1.04rem); font-weight: 700; line-height: 1.35;
    text-wrap: pretty;
    display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
    transition: color .4s var(--ease);
  }
  .pfeil {
    display: inline-block; width: .9em; height: .9em; margin-left: .25em; vertical-align: -.08em;
    color: var(--blau); opacity: 0; transform: translateX(-4px);
    transition: opacity .4s var(--ease), transform .5s var(--ease);
  }

  @media (hover: hover) {
    .kachel a:hover .bild { transform: translateY(-4px); box-shadow: 0 2px 4px rgba(0, 62, 89, .06), 0 22px 40px -18px rgba(0, 123, 177, .38); }
    .kachel a:hover .bild img { transform: scale(1.015); }
    .kachel a:hover .bild::after { transform: translateX(110%); }
    .kachel a:hover .titel { color: var(--blau); }
    .kachel a:hover .pfeil { opacity: 1; transform: none; }
  }
  .kachel a:active .bild { transform: scale(.985); transition-duration: .15s; }
  .kachel a:focus-visible .bild { box-shadow: 0 0 0 3px var(--weiss), 0 0 0 6px var(--blau); }
  .kachel a:focus-visible .titel { color: var(--blau); }
  .kachel a:focus-visible .pfeil { opacity: 1; transform: none; }

  /* Platzhalter – nur sichtbar, wenn ein Bild fehlt */
  .platzhalter .bild {
    display: grid; place-items: center; text-align: center; padding: 16px;
    background: repeating-linear-gradient(-45deg, #fff 0 10px, color-mix(in srgb, var(--blau-hell) 55%, #fff) 10px 20px);
    color: var(--blau); font-size: .8rem; font-weight: 700; letter-spacing: .04em; text-transform: uppercase;
  }
  .hinweis { color: var(--rot); }

  /* Ladezustand */
  .kachel.laedt { animation: none; }
  .kachel.laedt .bild { box-shadow: none; animation: puls 1.6s ease-in-out infinite alternate; }
  .kachel.laedt .meta { gap: 8px; }
  .balken { display: block; height: .8em; border-radius: 4px; background: color-mix(in srgb, var(--blau-hell) 60%, var(--weiss)); }
  .balken.kurz { width: 45%; }
  @keyframes puls { from { opacity: .55; } to { opacity: 1; } }
  .fehler { grid-column: 1 / -1; max-width: 46ch; color: var(--text-leise); }
  .fehler a { color: var(--blau); }

  /* ── Fuß ── */
  footer {
    display: flex; flex-wrap: wrap; gap: 14px 28px; align-items: baseline; justify-content: space-between;
    padding-block: clamp(72px, 12vw, 120px) 40px;
    color: var(--text-leise); font-size: .88rem;
  }
  footer nav { display: flex; flex-wrap: wrap; gap: 6px 22px; }
  footer a { color: inherit; text-decoration: none; padding-block: 6px; }
  footer a:hover, footer a:focus-visible { color: var(--blau); text-decoration: underline; text-underline-offset: 4px; }
  footer .web { color: var(--text); font-weight: 700; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
    .kachel a:hover .bild, .kachel a:hover .bild img { transform: none; }
  }
</style>
</head>
<body>
<a class="skip" href="#beitraege">Zu den Beiträgen</a>

<div class="flow" aria-hidden="true"><span class="a"></span><span class="b"></span><span class="c"></span></div>

<div class="seite">
  <header>
    <a class="logo" href="https://www.gfbv.de/" aria-label="Gesellschaft für bedrohte Völker – zur Website">
      <img src="gfbv-logo.svg" alt="Gesellschaft für bedrohte Völker" width="223" height="51">
    </a>
    <div class="intro">
      <h1>Mehr zu unseren <span class="akzent">Beiträgen</span></h1>
      <p class="unterzeile">Tippe auf ein Bild, um den Artikel, die Aktion oder den Termin zu öffnen.</p>
    </div>
  </header>

  <main id="beitraege">
    <h2 class="sr" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Aktuelle Instagram-Beiträge</h2>
    <ul class="raster" id="raster"></ul>
  </main>

  <footer>
    <a class="web" href="https://www.gfbv.de/">gfbv.de</a>
    <nav aria-label="Weitere Links">
      <a href="https://www.instagram.com/bedrohtevoelker/">Instagram @bedrohtevoelker</a>
      <a href="https://www.gfbv.de/newsletter/">Newsletter</a>
      <a href="https://www.gfbv.de/impressum/">Impressum</a>
      <a href="https://www.gfbv.de/datenschutz/">Datenschutz</a>
    </nav>
  </footer>
</div>

<script>
/* ────────────────────────────────────────────────────────────────
   Die Beiträge stehen in „beitraege.json“ und werden automatisch
   aus Instagram aktualisiert (skript/aktualisieren.py).
   Titel oder Link eines Beitrags korrigieren: skript/korrekturen.json
   ──────────────────────────────────────────────────────────────── */
(function () {
  const raster = document.getElementById("raster");
  const fmt = new Intl.DateTimeFormat("de-DE", { day: "numeric", month: "short", year: "numeric" });
  const pfeil = '<svg class="pfeil" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 2.5 8.5 8 3 13.5M8 2.5 13.5 8 8 13.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

  // Ruhiger Ladezustand: leere Kacheln in der Form des Rasters
  raster.setAttribute("aria-busy", "true");
  raster.innerHTML = Array.from({ length: 8 }, () =>
    '<li class="kachel laedt" aria-hidden="true"><div class="bild"></div><div class="meta"><span class="balken kurz"></span><span class="balken"></span></div></li>').join("");

  function zeigen(liste) {
    liste = liste.slice().sort((a, b) => String(b.datum).localeCompare(String(a.datum)));
    raster.innerHTML = liste.map((b, i) => {
      const d = new Date(b.datum + "T12:00:00");
      const datum = isNaN(d) ? "" : fmt.format(d);
      const bild = b.bild
        ? `<img src="${esc(b.bild)}" alt="" width="512" height="640" ${i < 4 ? 'fetchpriority="high"' : 'loading="lazy"'} decoding="async">`
        : `<span>Bild fehlt</span>`;
      return `<li class="kachel${b.bild ? "" : " platzhalter"}" style="--i:${Math.min(i, 12)}">
        <a href="${esc(b.ziel)}" target="_blank" rel="noopener">
          <div class="bild">${bild}</div>
          <div class="meta">
            <div class="zeile"><span class="art">${esc(b.art)}</span><time datetime="${esc(b.datum)}">${datum}</time></div>
            <p class="titel">${esc(b.titel)}${pfeil}</p>
          </div>
        </a>
      </li>`;
    }).join("");
    raster.removeAttribute("aria-busy");

    raster.querySelectorAll(".bild img").forEach(img => {
      img.addEventListener("error", () => {
        img.closest(".kachel").classList.add("platzhalter");
        img.replaceWith(Object.assign(document.createElement("span"), { textContent: "Bild fehlt" }));
      }, { once: true });
    });
  }

  function fehler() {
    raster.removeAttribute("aria-busy");
    raster.innerHTML = '<li class="fehler"><p>Die Beiträge lassen sich gerade nicht laden. Alle aktuellen Meldungen findest du auf <a href="https://www.gfbv.de/aktuelles/news/">gfbv.de</a>.</p></li>';
  }

  fetch("beitraege.json", { cache: "no-cache" })
    .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(daten => {
      const liste = Array.isArray(daten) ? daten : (daten.beitraege || []);
      liste.length ? zeigen(liste) : fehler();
    })
    .catch(fehler);
})();
</script>

</body>
</html>
